<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — MarketMind Portal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, rgba(15, 23, 42, 0.02) 60%),
                  radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.08) 0%, rgba(15, 23, 42, 0.02) 60%),
                  #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid var(--mm-border);
      border-radius: 20px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2.25rem;
    }
    .demo-pill {
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .demo-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Brand Icon & Title -->
    <div class="text-center mb-4">
      <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.45rem;">
        <i class="fa-solid fa-brain"></i>
      </div>
      <h3 class="fw-extrabold text-dark mb-1">Market<span class="text-primary">Mind</span> Admin</h3>
      <p class="text-muted small">Sign in to access DWDM administration & telemetry</p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div class="alert alert-danger border-0 shadow-sm d-flex align-items-center gap-2 mb-3 py-2 small" role="alert">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
      <div class="mb-3">
        <label for="usernameInput" class="form-label small fw-bold text-dark">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control border-start-0" id="usernameInput" name="username" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="passwordInput" class="form-label small fw-bold text-dark mb-0">Password</label>
          <button type="button" id="togglePasswordBtn" class="btn btn-link p-0 text-muted small text-decoration-none" style="font-size: 0.78rem;">
            <i class="fa-solid fa-eye me-1"></i> Show
          </button>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control border-start-0" id="passwordInput" name="password" placeholder="••••••••••••" required>
        </div>
      </div>

      <div class="d-flex flex-column gap-2 mt-3">
        <button type="submit" class="btn btn-mm-primary w-100 py-2 fw-bold">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter
        </button>
        <a href="{{ url_for('admin.quick_login') }}" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="fa-solid fa-bolt"></i> 1-Click Instant Enter as Admin
        </a>
      </div>
    </form>

    <!-- Viva Evaluator Demo Credentials Quick-Fill -->
    <div class="mt-4 pt-3 border-top">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="small fw-bold text-muted text-uppercase" style="font-size: 0.72rem;"><i class="fa-solid fa-key text-warning me-1"></i> Quick Test Accounts:</span>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <span class="demo-pill bg-primary-subtle text-primary border border-primary-subtle" onclick="fillCredentials('admin', 'Admin@MarketMind2024')">
          <i class="fa-solid fa-shield-halved me-1"></i> <strong>Admin</strong> (Full CRUD)
        </span>
        <span class="demo-pill bg-info-subtle text-info border border-info-subtle" onclick="fillCredentials('analyst_priya', 'Priya@2024')">
          <i class="fa-solid fa-chart-pie me-1"></i> <strong>Analyst</strong> (Read/ETL)
        </span>
        <span class="demo-pill bg-secondary-subtle text-secondary border border-secondary-subtle" onclick="fillCredentials('viewer_arun', 'Viewer@2024')">
          <i class="fa-solid fa-eye me-1"></i> <strong>Viewer</strong> (Cockpit)
        </span>
      </div>
    </div>

    <!-- Public Portal Return Link -->
    <div class="text-center mt-4">
      <a href="{{ url_for('main.home') }}" class="text-muted small text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Return to Public Web Portal
      </a>
    </div>
  </div>

  <script>
    function fillCredentials(user, pass) {
      document.getElementById('usernameInput').value = user;
      document.getElementById('passwordInput').value = pass;
    }

    document.getElementById('togglePasswordBtn').addEventListener('click', function() {
      const passInput = document.getElementById('passwordInput');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        this.innerHTML = '<i class="fa-solid fa-eye-slash me-1"></i> Hide';
      } else {
        passInput.type = 'password';
        this.innerHTML = '<i class="fa-solid fa-eye me-1"></i> Show';
      }
    });
  </script>
</body>
</html>
